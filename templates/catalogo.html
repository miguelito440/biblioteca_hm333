<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📚 Biblioteca Universitária</span>
            <div>
                <a href="/meus_livros" class="btn btn-outline-light btn-sm me-2">Meus Empréstimos</a>
                
                <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col">
                <h2>Catálogo de Livros</h2>
                <p class="text-muted">Escolha o livro que deseja pegar emprestado.</p>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Cálculo Vol. 1</h5>
                        <p class="card-text">Autor: James Stewart</p>
                        <span class="badge bg-success mb-3">Disponível</span>
                        <br>
                        <button class="btn btn-primary w-100" onclick="alert('Livro reservado com sucesso! (Função ilustrativa para o trabalho)')">Pegar Emprestado</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Fundamentos de Python</h5>
                        <p class="card-text">Autor: Liam Brown</p>
                        <span class="badge bg-warning text-dark mb-3">Última Cópia</span>
                        <br>
                        <button class="btn btn-primary w-100" onclick="alert('Livro reservado com sucesso! (Função ilustrativa para o trabalho)')">Pegar Emprestado</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Diário de um Banana</h5>
                        <p class="card-text">Autor: Jeff Kinney</p>
                        <span class="badge bg-danger mb-3">Indisponível</span>
                        <br>
                        <button class="btn btn-secondary w-100" disabled>Esgotado</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
