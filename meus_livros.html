<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Livros - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📚 Biblioteca Universitária</span>
            <div>
                <a href="/catalogo" class="btn btn-outline-light btn-sm me-2">Ver Catálogo</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col">
                <h2>Meus Empréstimos</h2>
                <p class="text-muted">Gerencie os livros que estão com você.</p>
            </div>
        </div>

        <div class="card shadow-sm mb-3" id="livro-calculo">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-1">Cálculo Vol. 1</h5>
                    <p class="card-text text-muted mb-0">Data de devolução: 15/06/2026</p>
                </div>
                <button class="btn btn-success" onclick="devolverLivro('livro-calculo')">Devolver</button>
            </div>
        </div>
        
    </div>

    <script>
        function devolverLivro(idDoLivro) {
            // Mostra a mensagem de sucesso
            alert('Livro devolvido com sucesso!');
            // Faz a caixa do livro desaparecer da tela
            document.getElementById(idDoLivro).style.display = 'none';
        }
    </script>

</body>
</html>
